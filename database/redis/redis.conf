# Redis configuration for Dhaba Orders.
# The queue and statistics live in Redis, so persistence is enabled (AOF + RDB snapshots).

bind 0.0.0.0
port 6379
protected-mode no

# Append-only file: every write is logged; fsync once per second.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB snapshots as a secondary safety net.
save 900 1
save 300 10
save 60 10000

dir /data

# Never evict queue/stat keys. Cache keys carry their own TTLs.
maxmemory-policy noeviction

tcp-keepalive 60
loglevel notice
