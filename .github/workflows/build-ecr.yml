
name: Build and Push Images to ECR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      menu-api: ${{ steps.filter.outputs.menu-api }}
      orders-api: ${{ steps.filter.outputs.orders-api }}
      kitchen-worker: ${{ steps.filter.outputs.kitchen-worker }}
      stats-api: ${{ steps.filter.outputs.stats-api }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            menu-api:
              - 'menu-api/**'
            orders-api:
              - 'orders-api/**'
            kitchen-worker:
              - 'kitchen-worker/**'
            stats-api:
              - 'stats-api/Dockerfile'
              - 'stats-api/**'

  prepare:
    name: Prepare build matrix
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          WEB: ${{ needs.changes.outputs.web }}
          MENU: ${{ needs.changes.outputs.menu-api }}
          ORDERS: ${{ needs.changes.outputs.orders-api }}
          KITCHEN: ${{ needs.changes.outputs.kitchen-worker }}
          STATS: ${{ needs.changes.outputs.stats-api }}
        run: |
          MATRIX='[]'

          add_service() {
            MATRIX=$(jq -c \
              --arg service "$1" \
              --arg context "$2" \
              --arg dockerfile "$3" \
              --arg repository "$4" \
              '. + [{"service":$service,"context":$context,"dockerfile":$dockerfile,"repository":$repository}]' \
              <<< "$MATRIX")
          }

          [[ "$WEB" == "true" ]] && add_service web ./web ./web/Dockerfile dhaba-web
          [[ "$MENU" == "true" ]] && add_service menu-api ./menu-api ./menu-api/Dockerfile dhaba-menu-api
          [[ "$ORDERS" == "true" ]] && add_service orders-api ./orders-api ./orders-api/Dockerfile dhaba-orders-api
          [[ "$KITCHEN" == "true" ]] && add_service kitchen-worker ./kitchen-worker ./kitchen-worker/Dockerfile dhaba-kitchen-worker
          [[ "$STATS" == "true" ]] && add_service stats-api ./stats-api ./stats-api/Dockerfile dhaba-stats-api
          [[ "$STATS" == "true" ]] && add_service stats-nginx ./stats-api ./stats-api/Dockerfile.nginx dhaba-stats-nginx

          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected services: $MATRIX"

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Wait for ECR vulnerability scan
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for attempt in {1..20}; do
            STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "$REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)

            echo "Scan status: $STATUS"

            if [[ "$STATUS" == "COMPLETE" ]]; then
              break
            fi

            if [[ "$STATUS" == "FAILED" ]]; then
              echo "ECR vulnerability scan failed."
              exit 1
            fi

            sleep 15
          done

          if [[ "$STATUS" != "COMPLETE" ]]; then
            echo "ECR scan did not complete in time."
            exit 1
          fi

      - name: Fail if critical vulnerabilities exist
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)

          CRITICAL=${CRITICAL:-0}
          echo "Critical vulnerabilities: $CRITICAL"

          if [[ "$CRITICAL" != "None" && "$CRITICAL" -gt 0 ]]; then
            echo "Critical vulnerabilities found. Failing pipeline."
            exit 1
          fi
