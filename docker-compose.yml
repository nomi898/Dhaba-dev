
services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhaba}
      POSTGRES_USER: ${POSTGRES_USER:-dhaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhaba-network

  # 2. Redis Cache and Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhaba-network

  # 3. Menu API - Python / FastAPI
  menu-api:
    build:
      context: ./menu-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dhaba}
      POSTGRES_USER: ${POSTGRES_USER:-dhaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MENU_CACHE_TTL_SECONDS: ${MENU_CACHE_TTL_SECONDS:-300}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhaba-network

  # 4. Orders API - Go
  orders-api:
    build:
      context: ./orders-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dhaba}
      DB_USER: ${POSTGRES_USER:-dhaba}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhaba-network

  # 5. Kitchen Worker - Java / Spring Boot
  kitchen-worker:
    build:
      context: ./kitchen-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dhaba}
      POSTGRES_USER: ${POSTGRES_USER:-dhaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      WORKER_HEARTBEAT_FILE: /tmp/kitchen-worker-heartbeat
      KITCHEN_AUTO_ADVANCE: ${KITCHEN_AUTO_ADVANCE:-true}
      KITCHEN_ACCEPT_DELAY: ${KITCHEN_ACCEPT_DELAY:-5s}
      KITCHEN_COOK_TIME: ${KITCHEN_COOK_TIME:-20s}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhaba-network

  # 6. Statistics API - Laravel / PHP-FPM
  stats-api:
    build:
      context: ./stats-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${LARAVEL_APP_KEY:?Set LARAVEL_APP_KEY in .env}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dhaba}
      DB_USERNAME: ${POSTGRES_USER:-dhaba}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dhaba-network

  # 7. Stats API Nginx
  stats-nginx:
    build:
      context: ./stats-api
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - stats-api
    networks:
      - dhaba-network

  # 8. Frontend - React / Nginx
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      MENU_API_URL: http://menu-api:8000
      ORDERS_API_URL: http://orders-api:8081
      STATS_API_URL: http://stats-nginx:8080
    depends_on:
      - menu-api
      - orders-api
      - stats-nginx
    networks:
      - dhaba-network

# Persistent storage
volumes:
  postgres_data:
  redis_data:

# Internal application network
networks:
  dhaba-network:
    driver: bridge
