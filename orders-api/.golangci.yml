version: "2"
run:
  timeout: 3m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - noctx
  settings:
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, forcetypeassert]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dhaba-orders/orders-api
