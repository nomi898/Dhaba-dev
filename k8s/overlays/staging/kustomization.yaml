apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dhaba-ingress
    patch: |-
      # Keep only the staging host (rule 1); drop the production host.
      - op: remove
        path: /spec/rules/0
