apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

patches:
  - path: patches.yaml
  - path: spread-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dhaba-ingress
    patch: |-
      # Keep only the production host (rule 0); drop the staging host.
      - op: remove
        path: /spec/rules/1
