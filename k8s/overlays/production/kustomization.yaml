apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

patches:
  - path: patches.yaml
  - path: spread-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dhaba-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dhaba.test
