apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchen-worker
  template:
    metadata:
      labels:
        app: kitchen-worker
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: kitchen-worker
          image: 270254976774.dkr.ecr.eu-north-1.amazonaws.com/dhaba-kitchen-worker:v1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
