apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: dhaba.test
      http:
        paths:
          - path: /api/menu
            pathType: Prefix
            backend:
              service:
                name: menu-api
                port:
                  number: 8000

          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 8081

          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: stats-nginx
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
