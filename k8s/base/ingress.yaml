apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: devopsnktask.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080

    - host: devopsnktask-staging.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
