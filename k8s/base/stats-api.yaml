apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-api
  template:
    metadata:
      labels:
        app: stats-api
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: stats-api
          image: 270254976774.dkr.ecr.eu-north-1.amazonaws.com/dhaba-stats-api:v1
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stats-api
spec:
  selector:
    app: stats-api
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-nginx
  template:
    metadata:
      labels:
        app: stats-nginx
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: stats-nginx
          image: 270254976774.dkr.ecr.eu-north-1.amazonaws.com/dhaba-stats-nginx:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stats-nginx
spec:
  selector:
    app: stats-nginx
  ports:
    - port: 8080
      targetPort: 8080
